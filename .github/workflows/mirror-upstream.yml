name: Mirror Upstream Repository

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-upstream-repository
  cancel-in-progress: false

jobs:
  mirror:
    name: Preserve all upstream branches and tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror control branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch every upstream ref
        run: |
          set -euo pipefail
          git remote add source https://github.com/XTLS/Xray-core.git
          git fetch --no-tags source \
            '+refs/heads/*:refs/remotes/source/*' \
            '+refs/tags/*:refs/source-tags/*'

      - name: Mirror branches without pruning deleted refs
        id: branches
        run: |
          set -euo pipefail
          declare -A destination_heads=()
          while read -r sha ref; do
            [[ -n "$sha" ]] || continue
            destination_heads["$ref"]="$sha"
          done < <(git ls-remote --heads origin 'refs/heads/mirror/*')

          updates=()
          leases=()
          archives=()
          changed=0
          archived=0
          while read -r sha source_ref; do
            [[ -n "$sha" ]] || continue
            name=${source_ref#refs/heads/}
            source="refs/remotes/source/$name"
            destination="refs/heads/mirror/$name"
            current=${destination_heads[$destination]:-}
            if [[ "$current" == "$sha" ]]; then
              continue
            fi

            if [[ -n "$current" ]]; then
              leases+=("--force-with-lease=$destination:$current")
              if ! git merge-base --is-ancestor "$current" "$sha"; then
                archive="refs/tags/upstream-archive/$name/$current"
                if ! git ls-remote --exit-code --tags origin "$archive" >/dev/null 2>&1; then
                  archives+=("$current:$archive")
                  archived=$((archived + 1))
                fi
              fi
            fi
            updates+=("+$source:$destination")
            changed=$((changed + 1))
          done < <(git ls-remote --heads source)

          if (( ${#updates[@]} > 0 )); then
            git push --atomic origin "${leases[@]}" "${archives[@]}" "${updates[@]}"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "archived=$archived" >> "$GITHUB_OUTPUT"

      - name: Mirror new tags without rewriting preserved tags
        id: tags
        run: |
          set -euo pipefail
          declare -A destination_tags=()
          while read -r sha ref; do
            [[ -n "$sha" ]] || continue
            [[ "$ref" == *'^{}' ]] && continue
            destination_tags["$ref"]="$sha"
          done < <(git ls-remote --tags origin)

          additions=()
          added=0
          conflicts=0
          while read -r sha source_ref; do
            [[ -n "$sha" ]] || continue
            [[ "$source_ref" == *'^{}' ]] && continue
            name=${source_ref#refs/tags/}
            destination="refs/tags/$name"
            current=${destination_tags[$destination]:-}
            if [[ -z "$current" ]]; then
              additions+=("refs/source-tags/$name:$destination")
              added=$((added + 1))
            elif [[ "$current" != "$sha" ]]; then
              echo "Preserving destination tag changed upstream: $name ($current != $sha)" >&2
              conflicts=$((conflicts + 1))
            fi
          done < <(git ls-remote --tags source)

          if (( ${#additions[@]} > 0 )); then
            git push --atomic origin "${additions[@]}"
          fi
          echo "added=$added" >> "$GITHUB_OUTPUT"
          echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"

      - name: Add preservation summary
        env:
          BRANCHES_CHANGED: ${{ steps.branches.outputs.changed }}
          BRANCHES_ARCHIVED: ${{ steps.branches.outputs.archived }}
          TAGS_ADDED: ${{ steps.tags.outputs.added }}
          TAG_CONFLICTS: ${{ steps.tags.outputs.conflicts }}
        run: |
          {
            echo "## XTLS/Xray-core mirror"
            echo
            echo "- Mirrored branch prefix: \`mirror/\`"
            echo "- Branches updated: \`$BRANCHES_CHANGED\`"
            echo "- Rewritten branch tips archived: \`$BRANCHES_ARCHIVED\`"
            echo "- New tags preserved: \`$TAGS_ADDED\`"
            echo "- Changed upstream tags left untouched: \`$TAG_CONFLICTS\`"
            echo "- Upstream deletions are intentionally not propagated."
          } >> "$GITHUB_STEP_SUMMARY"
