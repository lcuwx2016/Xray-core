name: Mirror Upstream Repository

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-upstream-repository
  cancel-in-progress: false

jobs:
  mirror:
    name: Preserve upstream main and tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror control branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          token: ${{ secrets.MIRROR_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Fetch upstream main and tags
        run: |
          set -euo pipefail
          git remote add source https://github.com/XTLS/Xray-core.git
          git fetch --no-tags source \
            '+refs/heads/main:refs/remotes/source/main' \
            '+refs/tags/*:refs/source-tags/*'

      - name: Update mirror/main without pruning on source failure
        id: branch
        run: |
          set -euo pipefail
          source=refs/remotes/source/main
          destination=refs/heads/mirror/main
          commit=$(git rev-parse "$source")
          current=$(git ls-remote --heads origin "$destination" | awk 'NR == 1 { print $1 }')
          if [[ "$current" == "$commit" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$current" ]]; then
            git push origin \
              --force-with-lease="$destination:$current" \
              "+$source:$destination"
          else
            git push origin "$source:$destination"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Mirror new tags without rewriting preserved tags
        id: tags
        run: |
          set -euo pipefail
          declare -A destination_tags=()
          while read -r sha ref; do
            [[ -n "$sha" ]] || continue
            [[ "$ref" == *'^{}' ]] && continue
            destination_tags["$ref"]="$sha"
          done < <(git ls-remote --tags origin)

          additions=()
          added=0
          conflicts=0
          while read -r sha source_ref; do
            [[ -n "$sha" ]] || continue
            [[ "$source_ref" == *'^{}' ]] && continue
            name=${source_ref#refs/tags/}
            destination="refs/tags/$name"
            current=${destination_tags[$destination]:-}
            if [[ -z "$current" ]]; then
              additions+=("refs/source-tags/$name:$destination")
              added=$((added + 1))
            elif [[ "$current" != "$sha" ]]; then
              echo "Preserving destination tag changed upstream: $name ($current != $sha)" >&2
              conflicts=$((conflicts + 1))
            fi
          done < <(git ls-remote --tags source)

          if (( ${#additions[@]} > 0 )); then
            git push --atomic origin "${additions[@]}"
          fi
          echo "added=$added" >> "$GITHUB_OUTPUT"
          echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"

      - name: Add preservation summary
        env:
          MAIN_CHANGED: ${{ steps.branch.outputs.changed }}
          TAGS_ADDED: ${{ steps.tags.outputs.added }}
          TAG_CONFLICTS: ${{ steps.tags.outputs.conflicts }}
        run: |
          {
            echo "## XTLS/Xray-core mirror"
            echo
            echo "- Destination branch: \`mirror/main\`"
            echo "- Main updated: \`$MAIN_CHANGED\`"
            echo "- New tags preserved: \`$TAGS_ADDED\`"
            echo "- Changed upstream tags left untouched: \`$TAG_CONFLICTS\`"
            echo "- Upstream deletions are intentionally not propagated."
          } >> "$GITHUB_STEP_SUMMARY"
